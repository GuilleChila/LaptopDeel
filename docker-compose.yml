services:
  mariadb-laptopdeel:
    image: mariadb:latest
    container_name: mariadb-laptopdeel
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: laptopdeel_db
      MARIADB_USER: leadepre
      MARIADB_PASSWORD: leloandro
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb_laptopdeel_data:/var/lib/mysql

volumes:
  mariadb_laptopdeel_data:
